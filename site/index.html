<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Psalms</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: .75rem 1rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 1.1rem; margin: 0; }
  a.btn { background: #222; color: #fff; padding: .4rem .8rem; border-radius: 6px; text-decoration: none; }
  iframe { flex: 1; width: 100%; border: 0; }
</style>
<header>
  <h1>Weekly Psalms <span id="week"></span></h1>
  <a class="btn" href="psalms.pdf" download>Download PDF</a>
  <small>Print landscape, then fold into 8.</small>
</header>
<iframe src="fold.html" title="How to fold the weekly psalms"></iframe>
<script>
  fetch("latest.json").then(r => r.json()).then(j => {
    const d = new Date(j.start + "T12:00:00");
    document.getElementById("week").textContent =
      "– week of " + d.toLocaleDateString(undefined, { month: "long", day: "numeric" });
  }).catch(() => {});
</script>
